name: Release
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"] # stable versions only, so a pre-release never becomes /releases/latest

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - { target: aarch64-apple-darwin, os: macos-latest }
          # musl: a static binary that runs regardless of the host's glibc version
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      # Builds the release binary that gets packaged; the integration test also runs it on this target.
      - run: cargo test --release --locked --target ${{ matrix.target }}
      - name: Package
        run: |
          name=ug-lite-${{ matrix.target }}.tar.gz
          tar -C target/${{ matrix.target }}/release -czf "$name" ug-lite
          shasum -a 256 "$name" > "$name.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: ug-lite-${{ matrix.target }}.tar.gz*

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes ug-lite-*
        env:
          GH_TOKEN: ${{ github.token }}
